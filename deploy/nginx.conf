# Raajwarasa web server — SPA + reverse proxy for the Spring Boot API.
# Used both by the frontend Docker image (service hostname: `api`) and as a
# template for single-host VPS deployments.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- baseline hardening headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml image/x-icon;

    # --- API + uploaded media proxied to the backend ---
    # ^~ gives these prefix locations precedence over the static-asset regex
    # below — otherwise uploaded .jpg/.png URLs would hit the SPA fallback.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser and API are same-origin through this proxy; strip the
        # Origin header so the API's CORS policy never rejects proxied traffic.
        proxy_set_header Origin "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /actuator/health {
        proxy_pass http://api:8080;
        access_log off;
    }

    # --- SPA: unknown paths resolve to the app shell ---
    location / {
        try_files $uri /index.html;
    }

    # --- hashed static assets are immutable ---
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.html;
    }
}