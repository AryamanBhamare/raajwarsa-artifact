spring.application.name=raajwarasa-backend
server.port=${SERVER_PORT:8080}

# ---- Database ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/raajwarasa}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Schema is managed by Flyway (db/migration): never let Hibernate auto-create.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null

# ---- Server lifecycle ----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- Actuator / monitoring ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- File upload ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ---- JWT ----
raajwarasa.jwt.secret=${JWT_SECRET:raajwarasa-heritage-change-this-secret-in-production-0123456789abcdef}
raajwarasa.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- Admin bootstrap ----
raajwarasa.admin.username=${ADMIN_USERNAME:admin}
raajwarasa.admin.password=${ADMIN_PASSWORD:rajvarsa@123}

# ---- Media storage ----
raajwarasa.upload.dir=${UPLOAD_DIR:./uploads}

# ---- Allow any CORS origins from env (production) ----
raajwarasa.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

logging.level.org.hibernate.SQL=warn